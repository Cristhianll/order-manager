# ============================================================
# Perfil "docker": PostgreSQL + configuracion por variables de entorno
# (ninguna credencial queda escrita en el repositorio)
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:orders}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Seguridad: sin consola H2 ni detalles internos en produccion
spring.h2.console.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Trazabilidad: /actuator/info expone version y commit desplegado
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.git-sha=${GIT_SHA:unknown}
