# Autoescalado horizontal (requiere metrics-server: "minikube addons enable metrics-server")
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-manager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-manager
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
