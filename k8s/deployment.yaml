apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-manager
  labels: { app: order-manager }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: order-manager }
  template:
    metadata:
      labels: { app: order-manager }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: order-manager
          # Local (kind/minikube): docker build -t order-manager:local .
          # Desde GHCR: ghcr.io/<usuario>/order-manager:<sha-del-commit>
          image: order-manager:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8098
          envFrom:
            - configMapRef: { name: order-manager-config }
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: order-manager-db, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: order-manager-db, key: DB_PASSWORD } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8098 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8098 }
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
