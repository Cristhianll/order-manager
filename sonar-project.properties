# Referencia de la configuracion de SonarCloud.
# El pipeline usa sonar-maven-plugin y recibe organizacion/proyecto via
# variables del repositorio (SONAR_ORGANIZATION, SONAR_PROJECT_KEY).
sonar.projectKey=CAMBIAR_POR_TU_PROJECT_KEY
sonar.organization=CAMBIAR_POR_TU_ORGANIZACION
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
