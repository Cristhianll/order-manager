name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Principio de minimo privilegio: cada job pide solo lo que necesita
permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  # ------------------------------------------------------------
  # 1) Build + pruebas unitarias + cobertura minima (IE2)
  # ------------------------------------------------------------
  test:
    name: Build y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # "verify" ejecuta JUnit + JaCoCo y FALLA si la cobertura de lineas < 60% (pom.xml)
      - name: Ejecutar pruebas y verificar cobertura
        run: mvn -B verify

      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1{m+=$8;c+=$9} END{printf "### Cobertura de lineas: %.1f%% (%d/%d)\n", 100*c/(m+c), c, m+c}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/site/jacoco/

  # ------------------------------------------------------------
  # 2) Analisis estatico de codigo con SonarCloud (IE3)
  #    Bloquea el pipeline si no pasa el Quality Gate
  # ------------------------------------------------------------
  sonar:
    name: Análisis de código (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar necesita el historial completo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Analizar y esperar Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=cristhianll \
            -Dsonar.projectKey=Cristhianll_order-manager \
            -Dsonar.qualitygate.wait=true

  # ------------------------------------------------------------
  # 3) Escaneo de dependencias y secretos con Trivy (IE3)
  #    Dependabot (dependabot.yml) complementa con PRs automaticos
  # ------------------------------------------------------------
  scan-dependencies:
    name: Escaneo de dependencias y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (filesystem) - falla con HIGH/CRITICAL con parche disponible
        run: |
          IGNORE=""
          if [ -f .trivyignore ]; then IGNORE="--ignorefile /src/.trivyignore"; fi
          docker run --rm -v "$PWD:/src" -v "$HOME/.cache/trivy:/root/.cache" \
            "$TRIVY_IMAGE" fs --scanners vuln,secret $IGNORE \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src

  # ------------------------------------------------------------
  # 4) Construccion de imagen Docker + escaneo de la imagen + push (IE1, IE3)
  # ------------------------------------------------------------
  docker:
    name: Imagen Docker
    needs: [test, sonar, scan-dependencies]   # solo se construye si TODO lo anterior pasa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen (local, para escanear)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (imagen) - bloquea con HIGH/CRITICAL
        run: |
          IGNORE=""
          if [ -f .trivyignore ]; then IGNORE="--ignorefile /src/.trivyignore"; fi
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/src" -v "$HOME/.cache/trivy:/root/.cache" "$TRIVY_IMAGE" image $IGNORE \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${{ steps.meta.outputs.image }}:${{ github.sha }}"

      - name: Login en GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Trazabilidad: la imagen se etiqueta con el SHA exacto del commit
      - name: Publicar imagen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha

  # ------------------------------------------------------------
  # 5) Despliegue automatico en entorno simulado (Docker Compose) (IE4, IE5)
  # ------------------------------------------------------------
  deploy:
    name: Despliegue (Docker Compose)
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Desplegar imagen del commit
        run: |
          APP_IMAGE="${{ needs.docker.outputs.image }}:${{ github.sha }}"
          # Credencial efimera generada en cada despliegue (no hay secretos en el repo)
          DB_PASSWORD="$(openssl rand -hex 16)"
          # Disponibles para los pasos siguientes (logs / down)
          {
            echo "APP_IMAGE=$APP_IMAGE"
            echo "GIT_SHA=${{ github.sha }}"
            echo "DB_PASSWORD=$DB_PASSWORD"
          } >> "$GITHUB_ENV"
          # Y para este mismo paso
          export APP_IMAGE DB_PASSWORD GIT_SHA="${{ github.sha }}"
          docker compose pull app
          docker compose up -d --no-build --wait --wait-timeout 180

      - name: Smoke tests
        run: |
          curl -fsS http://localhost:8098/actuator/health
          curl -fsS -o /dev/null -w "GET /api/orders -> %{http_code}\n" http://localhost:8098/api/orders
          curl -fsS -o /dev/null -w "POST /api/orders -> %{http_code}\n" -X POST \
            -H 'Content-Type: application/json' -d '{"customerName":"smoke-test"}' \
            http://localhost:8098/api/orders
          # Trazabilidad: lo que corre debe ser EXACTAMENTE el commit que disparo el pipeline
          curl -fsS http://localhost:8098/actuator/info | tee info.json
          grep -q "${{ github.sha }}" info.json

      - name: Registrar despliegue
        run: |
          {
            echo "### Despliegue exitoso"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Imagen: \`${{ needs.docker.outputs.image }}:${{ github.sha }}\`"
            echo "- Autor: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs si falla
        if: failure()
        run: docker compose logs --tail=100

      - name: Limpiar entorno simulado
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------
  # 6) Alerta: si algo falla en main se abre un Issue automaticamente (IE3)
  # ------------------------------------------------------------
  notify-failure:
    name: Alerta de fallo
    needs: [test, sonar, scan-dependencies, docker, deploy]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Abrir issue de alerta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "Pipeline fallido en ${{ github.ref_name }} (${GITHUB_SHA::7})" \
            --body "El pipeline falló. Revisa la ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
